name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Install Firebase seeder dependencies
        run: npm ci --prefix tool/firestore_seed --omit=dev --no-audit --no-fund

      - name: Validate Firebase seed payload
        env:
          CONFIRM_PROJECT: ash-shifa-ruqyah
        run: |
          dart tool/firestore_seed/export_mom_child_content.dart \
            "$RUNNER_TEMP/mom-child-content.json"
          node --check tool/firestore_seed/seed.mjs
          node tool/firestore_seed/seed.mjs \
            "$RUNNER_TEMP/mom-child-content.json" --validate-only
