name: Temporary Bazzer page formatter
on:
  pull_request:
    paths:
      - lib/features/bazzer_reminder/screens/bazzer_reminder_page.dart
      - .github/workflows/bazzer_format_tmp.yml
permissions:
  contents: read
jobs:
  formatted-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/features/bazzer_reminder/screens/bazzer_reminder_page.dart
      - uses: actions/upload-artifact@v4
        with:
          name: bazzer-formatted-page
          path: lib/features/bazzer_reminder/screens/bazzer_reminder_page.dart
