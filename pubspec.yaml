name: ash_shifa_ruqyah
description: "Ash-Shifa Ruqyah: prayer, wellbeing, family care, and Ruqyah tools."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_database: ^12.2.0
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.3
  
  audioplayers: 6.8.1
  just_audio: ^0.10.5
  adhan: ^2.0.0
  audio_video_progress_bar: ^2.0.1
  screen_security: ^1.0.0
  shared_preferences: ^2.2.3
  share_plus: ^12.0.1
  intl: ^0.20.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  permission_handler: ^12.0.1
  speech_to_text: ^7.0.0
  uuid: ^4.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/
