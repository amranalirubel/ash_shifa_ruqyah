name: Remove migrated Mom & Child legacy documents

on:
  push:
    branches:
      - codex/remove-mom-child-legacy-docs
    paths:
      - '.github/workflows/remove_mom_child_legacy_once.yml'
      - 'tool/firestore_seed/seed.mjs'
      - 'tool/firestore_seed/package-lock.json'
      - 'lib/utils/seed_mom_child_care.dart'

permissions:
  contents: read

concurrency:
  group: firebase-mom-child-content-seed
  cancel-in-progress: false

jobs:
  cleanup:
    name: Back up, verify, and remove two legacy documents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firebase-production

    steps:
      - name: Verify exact repository and cleanup branch
        env:
          SELECTED_REF: ${{ github.ref }}
          SELECTED_REPOSITORY: ${{ github.repository }}
        run: |
          test "$SELECTED_REPOSITORY" = "amranalirubel/ash_shifa_ruqyah"
          test "$SELECTED_REF" = "refs/heads/codex/remove-mom-child-legacy-docs"

      - name: Check out cleanup code
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export and validate bundled content
        run: >-
          dart tool/firestore_seed/export_mom_child_content.dart
          "$RUNNER_TEMP/mom-child-content.json"

      - name: Authenticate to the exact Firebase project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ash-shifa-ruqyah
          create_credentials_file: true

      - name: Install the pinned Firebase Admin SDK
        run: npm ci --prefix tool/firestore_seed --omit=dev --no-audit --no-fund

      - name: Preview exact cleanup
        env:
          CONFIRM_PROJECT: ash-shifa-ruqyah
          DRY_RUN: 'true'
          FORCE_REFRESH: 'false'
          DELETE_LEGACY_DOCUMENTS: 'true'
        run: >-
          node tool/firestore_seed/seed.mjs
          "$RUNNER_TEMP/mom-child-content.json"

      - name: Back up and delete exact legacy documents
        env:
          CONFIRM_PROJECT: ash-shifa-ruqyah
          DRY_RUN: 'false'
          FORCE_REFRESH: 'false'
          DELETE_LEGACY_DOCUMENTS: 'true'
        run: >-
          node tool/firestore_seed/seed.mjs
          "$RUNNER_TEMP/mom-child-content.json"
