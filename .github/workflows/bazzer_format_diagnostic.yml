name: Temporary Bazaar Formatter Diff

on:
  pull_request:
    paths:
      - lib/features/bazzer_reminder/**
      - .github/workflows/bazzer_format_diagnostic.yml

permissions:
  contents: read

jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Print exact formatter correction
        run: |
          dart format lib/features/bazzer_reminder
          git diff -- lib/features/bazzer_reminder
