name: Temporary CI-matched Bazzer formatter
on:
  pull_request:
    paths:
      - lib/features/bazzer_reminder/**
      - .github/workflows/bazzer_format_tmp.yml
permissions:
  contents: read
jobs:
  formatted-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - name: Show formatter diff
        run: git diff -- lib/features/bazzer_reminder
      - uses: actions/upload-artifact@v4
        with:
          name: bazzer-ci-formatted-source
          path: lib/features/bazzer_reminder/**/*.dart
